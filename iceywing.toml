[project]
name = "NeuroScape2.0-Cirno"

[environment]
# Iceywing 0.4 uses Node as the primary adapter.
# `just setup` also restores the Python EEG calibration environment.
type = "node"
isolated = true

[tasks]
setup = "just setup"
run = "just run"
verify = "just verify"
doctor = "just doctor"

[git]
protected_branches = [
  "main",
  "calibration-single-guided-baseline"
]

allowed_branches = [
  "research-v1",
  "feat/*",
  "fix/*",
  "docs/*"
]

[pop]
delete_patch_after_success = true
push_default = false
